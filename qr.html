<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR de recepción · Registro de visita</title>
<style>
:root{--bg:#e9e9e9;--card:#fff;--line:#e7e7e7;--dark:#292929;--muted:#969696}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--dark)}
.app{width:min(520px,100%);background:#f8f8f8;padding:28px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.logo{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;background:var(--dark);color:#fff;font-size:.8rem;font-weight:800}
.brand h1{margin:0;font-size:1.15rem}.brand p{margin:4px 0 0;color:var(--muted);font-size:.82rem}
.card{background:var(--card);border:1px solid #ededed;border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.05);text-align:center}
h2{margin:0 0 6px;font-size:1.15rem}.desc{margin:0 0 24px;color:var(--muted);font-size:.88rem}
.qr-frame{display:inline-block;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}
#qr{display:grid;place-items:center;min-height:220px}
#qr canvas{display:block;width:220px;height:220px;image-rendering:pixelated}
.url{margin:20px auto 0;display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:10px 16px;border-radius:999px;background:#f3f3f3;border:1px solid var(--line);font-size:.8rem;font-weight:700;color:#555;word-break:break-all;text-decoration:none}
.url:hover{text-decoration:underline}
.hint{margin:18px 0 0;color:var(--muted);font-size:.8rem}
.actions{display:flex;gap:10px;margin-top:24px}
button{border:0;border-radius:11px;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}
.primary{flex:1;background:var(--dark);color:#fff}
.primary:hover{opacity:.88}
.note{margin-top:16px;color:var(--muted);font-size:.75rem;line-height:1.5}
@media(max-width:600px){.app{padding:18px}.card{padding:22px}#qr canvas{width:180px;height:180px}}
@media print{
  @page{margin:1.2cm}
  body{background:#fff;padding:0;display:block}
  .app{background:#fff;padding:0;margin:0 auto}
  .actions,.note{display:none}
  .brand{margin-bottom:14px}
  .card{box-shadow:none;border:1px solid #ddd;border-radius:12px;padding:20px}
  #qr canvas{width:200px;height:200px}
}
</style>
</head>
<body>
<main class="app">
<div class="brand"><div class="logo">DCE</div><div><h1>Registro de visita</h1><p>División de Ciencias Exactas</p></div></div>

<section class="card">
<h2>Escanea para registrar tu visita</h2>
<p class="desc">Este código es para uso en recepción.</p>

<div class="qr-frame">
<div id="qr" role="img" aria-label="Código QR de registro de visita"></div>
</div>

<a class="url" id="url" target="_blank" rel="noopener"></a>
<p class="hint" id="hint">Generando código…</p>

<div class="actions">
<button class="primary" id="printBtn">Imprimir QR</button>
</div>

<p class="note">Imprime esta página y colócala en el punto de recepción.
El estudiante escanea el código con su teléfono y registra su visita en segundos.</p>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  const url='https://registro-visitas.pages.dev/';
  const box=document.getElementById('qr');
  const hint=document.getElementById('hint');
  const link=document.getElementById('url');
  link.href=url;
  link.textContent=url;
  document.getElementById('printBtn').onclick=()=>window.print();

  try{
    new QRCode(box,{
      text:url,
      width:220,
      height:220,
      colorDark:'#292929',
      colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.M
    });
    hint.textContent='Imprime y coloca en recepción.';
  }catch(e){
    hint.textContent='No se pudo generar el código. Abre la URL directamente:';
  }
})();
</script>
</body>
</html>
